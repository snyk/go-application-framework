openapi: 3.0.3
info:
  title: Entitlements Service Contributor Ingest API
  description: |
    Draft OpenAPI for CLI contributor billing ingest. Replace with the official
    entitlements-service spec when available.
  version: 2026-07-29
servers:
  - url: /
paths:
  /rest/api/hidden/contributors/ingest:
    post:
      operationId: ingestContributors
      summary: Ingest CLI contributor billing events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributorIngestRequest'
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
components:
  schemas:
    ContributorIngestRequest:
      type: object
      required:
        - source
        - capability
        - items
      properties:
        source:
          type: string
        capability:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContributorIngestItem'
    ContributorIngestItem:
      type: object
      required:
        - scope_id
        - target_id
        - contributors
      properties:
        scope_id:
          type: string
        target_id:
          type: string
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/ContributorIngestContributor'
    ContributorIngestContributor:
      type: object
      required:
        - email
        - latest_commit_date
      properties:
        email:
          type: string
        latest_commit_date:
          type: string
          format: date-time
