version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1
  win: circleci/windows@5.0


base_image: &base_image
  resource_class: small
  docker:
    - image: cimg/go:1.26

# Define the jobs we want to run for this project
jobs:
  unit_test:
    <<: *base_image
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Run unit tests
          command: make test

  windows_test:
    executor:
      name: win/server-2022
      version: "current"

    steps:
      - run:
          name: Configure git to translate line terminators locally
          command: git config --global core.autocrlf input
      - checkout
      - run:
          name: Run unit tests
          command: go test ./...

  macos_test:
    macos:
      xcode: "15.3.0"
    resource_class: m4pro.medium
    environment:
      # Bump this alongside the "go" directive in go.mod.
      GO_VERSION: "1.26.2"
    steps:
      - checkout
      - run:
          name: Install Go
          command: |
            set -euo pipefail
            curl -sSfL -o go.tar.gz "https://go.dev/dl/go${GO_VERSION}.darwin-arm64.tar.gz"
            mkdir -p "$HOME/go-toolchain"
            tar -C "$HOME/go-toolchain" -xzf go.tar.gz
            rm go.tar.gz
            echo 'export PATH="$HOME/go-toolchain/go/bin:$PATH"' >> "$BASH_ENV"
            "$HOME/go-toolchain/go/bin/go" version | grep -q "go${GO_VERSION}"
      - run:
          name: Run machine identity unit tests
          command: go test ./pkg/machineid/...

  build:
    <<: *base_image
    steps:
      - checkout
      - restore-build-cache
      - run:
          environment:
            # we re-use the Go build cache as our lint-cache too.
            GOLANGCI_LINT_CACHE: /home/circleci/.cache/go-build
          name: Lint
          command: make lint
      - run:
          name: Build
          command: make build
      - save-build-cache

  security-scans:
    <<: *base_image
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto
          open-source-agentic-fix-enabled: true
          open-source-agentic-fix-base-branch: main

commands:
  save-build-cache:
    steps:
      - save_cache:
          name: Saving Go build cache
          key: go-build-cache-{{ .Branch }}-{{ .Revision }}
          paths:
            - /home/circleci/.cache/go-build
  restore-build-cache:
    steps:
      - restore_cache:
          name: Restoring Go build cache
          keys:
            - go-build-cache-{{ .Branch }}-{{ .Revision }}
            - go-build-cache-{{ .Branch }}-
            - go-build-cache-


# Orchestrate our job run sequence
workflows:
  test_and_release:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: cli-alerts
      - security-scans:
          context:
            - devex_cli
            - prodsec-orb-runtime
      - unit_test:
          name: Unit tests
      - windows_test:
          name: Windows tests
      - macos_test:
          name: macOS tests
      - build:
          name: Build
          requires:
            - Unit tests
            - Windows tests
            - macOS tests
